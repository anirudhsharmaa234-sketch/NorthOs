name: ABEL build deploy

on:
  push:
    branches:
      - abel-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch verified ABEL production source
        run: |
          curl --fail-with-body --location --retry 4 --retry-all-errors \
            'https://qkgxknpzydxwxzzttmsl.supabase.co/storage/v1/object/public/abel-frames/site/ABEL_CINEMATIC_PROD_SOURCE.zip' \
            --output /tmp/abel-source.zip
          echo '8f24228d70fe83ddcdac7c282408d36112adc65683745aa16164ef359d1c9ce1  /tmp/abel-source.zip' | sha256sum --check
          unzip -oq /tmp/abel-source.zip -d .

      - name: Set hosted site base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          needle = 'export default defineConfig({'
          if "base: '/functions/v1/abel-site/'" not in s:
              s = s.replace(needle, needle + "\n  base: '/functions/v1/abel-site/',", 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build exact interaction-pass site
        run: npm run build

      - name: Package static output
        run: |
          test -f dist/index.html
          cd dist
          zip -qr /tmp/abel-dist.zip .

      - name: Upload static output to Supabase
        run: |
          curl --fail-with-body --location --retry 4 --retry-all-errors \
            -X POST \
            -H 'Content-Type: application/zip' \
            --data-binary '@/tmp/abel-dist.zip' \
            'https://qkgxknpzydxwxzzttmsl.supabase.co/functions/v1/abel-upload-dist'

      - name: Verify published site entrypoint
        run: |
          curl --fail-with-body --location --retry 12 --retry-delay 2 --retry-all-errors \
            'https://qkgxknpzydxwxzzttmsl.supabase.co/functions/v1/abel-site/' \
            --output /tmp/published-index.html
          grep -q '<div id="root"></div>' /tmp/published-index.html
